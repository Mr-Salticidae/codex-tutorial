<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffdd57" />
  <meta name="description" content="当代年轻人精神状态检测：16个生活现场，测测你是哪种互联网限定人类。" />
  <title>当代年轻人精神状态检测 V1.5</title>
  <style>
:root {
  --ink: #191919;
  --paper: #fffaf0;
  --yellow: #ffdc58;
  --orange: #ff8a4c;
  --pink: #ff8eb5;
  --blue: #7fc8ff;
  --green: #90d9a8;
  --muted: #6e6a62;
  --line: #191919;
  --shadow: 7px 7px 0 #191919;
  --radius: 24px;
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--yellow); }
body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,.65) 0 5%, transparent 5.5%),
    radial-gradient(circle at 90% 18%, rgba(255,142,181,.55) 0 6%, transparent 6.5%),
    linear-gradient(135deg, #ffe879 0%, #ffc95e 100%);
}
button { font: inherit; }
button, .answer-card { -webkit-tap-highlight-color: transparent; }

.app-shell {
  width: min(100%, 760px);
  min-height: 100vh;
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top)) 18px max(26px, env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  justify-content: center;
}

.screen { width: 100%; animation: pop .34s ease both; }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }

.brand-pill, .scene-pill, .result-code {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 13px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: #fff;
  font-size: 13px;
  font-weight: 800;
  box-shadow: 3px 3px 0 var(--line);
}

.hero-card, .scene-card, .result-card, .loading-card {
  position: relative;
  overflow: hidden;
  border: 3px solid var(--line);
  border-radius: 30px;
  background: var(--paper);
  box-shadow: var(--shadow);
}
.hero-card { padding: 32px 24px 26px; }
.hero-card::after, .result-card::after {
  content: "";
  position: absolute;
  width: 140px;
  height: 140px;
  right: -55px;
  top: -55px;
  border: 3px solid var(--line);
  border-radius: 50%;
  background: var(--pink);
  z-index: 0;
}
.hero-card > *, .result-card > * { position: relative; z-index: 1; }

.brain { font-size: 72px; line-height: 1; margin: 20px 0 12px; filter: drop-shadow(4px 4px 0 rgba(25,25,25,.22)); }
h1 { font-size: clamp(34px, 8vw, 56px); line-height: 1.08; margin: 0; letter-spacing: -2px; }
.hero-subtitle { margin: 14px 0 0; font-size: 19px; font-weight: 800; }
.hero-copy { margin: 22px 0; line-height: 1.8; font-size: 15px; color: #3f3b35; }
.fact-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 22px; }
.fact { padding: 12px 8px; border: 2px solid var(--line); border-radius: 15px; background: #fff; text-align: center; font-size: 13px; font-weight: 800; }

.primary-button, .secondary-button, .ghost-button {
  min-height: 54px;
  border: 3px solid var(--line);
  border-radius: 16px;
  font-weight: 900;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease;
}
.primary-button { background: var(--orange); color: var(--ink); box-shadow: 5px 5px 0 var(--line); padding: 0 24px; }
.primary-button:hover, .secondary-button:hover, .ghost-button:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--line); }
.primary-button:active, .secondary-button:active, .ghost-button:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--line); }
.secondary-button { background: #fff; box-shadow: 4px 4px 0 var(--line); padding: 0 18px; }
.ghost-button { background: transparent; box-shadow: none; padding: 0 16px; }
.full { width: 100%; }
.tiny-note { text-align: center; margin: 14px 0 0; font-size: 12px; color: var(--muted); }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.progress-wrap { flex: 1; }
.progress-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; margin-bottom: 7px; }
.progress-track { height: 13px; border: 2px solid var(--line); border-radius: 999px; background: #fff; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-right: 2px solid var(--line); transition: width .25s ease; }

.scene-card { padding: 24px 20px 22px; }
.scene-title { margin: 15px 0 8px; font-size: clamp(28px, 7vw, 40px); letter-spacing: -1px; }
.scene-time { color: var(--muted); font-size: 13px; font-weight: 800; }
.chat-bubble {
  margin: 18px 0;
  padding: 17px 18px;
  border: 3px solid var(--line);
  border-radius: 8px 20px 20px 20px;
  background: #fff;
  font-size: 19px;
  font-weight: 900;
  line-height: 1.45;
  box-shadow: 4px 4px 0 rgba(25,25,25,.15);
}
.scene-prompt { margin: 16px 0 12px; font-size: 14px; color: var(--muted); font-weight: 800; }
.answers { display: grid; gap: 12px; }
.answer-card {
  width: 100%;
  padding: 16px 17px;
  text-align: left;
  border: 3px solid var(--line);
  border-radius: 17px;
  background: #fff;
  font-size: 15px;
  font-weight: 800;
  line-height: 1.55;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--line);
  transition: transform .12s ease, background .12s ease;
}
.answer-card:hover { transform: translate(-2px,-2px); background: #fff7c7; }
.answer-card:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--line); }
.answer-card { display: grid; grid-template-columns: 42px 1fr 34px; align-items: center; gap: 10px; }
.answer-emoji {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff7c7;
  font-size: 21px;
  box-shadow: 2px 2px 0 var(--line);
}
.answer-copy { min-width: 0; }
.answer-face {
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: #fff;
  font-size: 18px;
  transform: rotate(4deg);
}
.answer-card:nth-child(even) .answer-face { transform: rotate(-5deg); background: #e8f6ff; }
.answer-card:nth-child(3n) .answer-face { background: #ffe5ef; }
.meme-sticker {
  margin: 16px auto 0;
  width: fit-content;
  max-width: 100%;
  padding: 9px 13px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff;
  box-shadow: 3px 3px 0 var(--line);
  font-size: 13px;
  font-weight: 900;
  transform: rotate(-1deg);
}

.doctor-note { margin-top: 15px; padding: 13px 15px; border: 2px dashed var(--line); border-radius: 15px; background: #dff3ff; font-size: 13px; font-weight: 800; line-height: 1.6; }
.bottom-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.back-link { border: 0; background: none; text-decoration: underline; font-weight: 800; cursor: pointer; }

.loading-card { padding: 40px 24px; text-align: center; }
.loader-face { font-size: 68px; animation: wobble 1s ease-in-out infinite alternate; }
@keyframes wobble { to { transform: rotate(7deg) scale(1.05); } }
.loading-title { font-size: 28px; margin: 16px 0 10px; }
.loading-line { min-height: 48px; font-weight: 800; color: #403c36; }
.fake-progress { height: 22px; border: 3px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; margin-top: 18px; }
.fake-progress span { display: block; height: 100%; width: 10%; background: var(--pink); transition: width .55s ease; }

.result-card { padding: 28px 22px 24px; }
.result-kicker { margin: 18px 0 4px; font-weight: 900; color: var(--muted); }
.result-title { margin: 0 0 10px; font-size: clamp(32px, 8vw, 49px); line-height: 1.1; letter-spacing: -1.5px; }
.result-slogan { font-size: 18px; font-weight: 900; line-height: 1.55; margin: 15px 0 20px; }
.diagnosis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.diagnosis-box { border: 2px solid var(--line); border-radius: 15px; background: #fff; padding: 13px; }
.diagnosis-box strong { display: block; margin-bottom: 7px; font-size: 12px; color: var(--muted); }
.diagnosis-box span { font-size: 17px; font-weight: 900; }
.symptoms, .warm-note { margin-top: 18px; border: 3px solid var(--line); border-radius: 19px; padding: 17px; background: #fff; }
.symptoms h3, .warm-note h3 { margin: 0 0 12px; font-size: 17px; }
.symptoms ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
.symptoms li { font-weight: 800; line-height: 1.5; }
.symptoms li::before { content: "☑ "; }
.warm-note { background: #e7f8ea; line-height: 1.75; font-weight: 700; }
.result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.result-actions .primary-button { grid-column: 1 / -1; }
.share-text { margin-top: 15px; padding: 12px; border: 2px dashed var(--line); border-radius: 13px; font-size: 13px; line-height: 1.6; background: #fff7c7; }

.modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 18px; background: rgba(25,25,25,.68); }
.modal.hidden { display: none; }
.modal-card { position: relative; width: min(100%, 390px); padding: 26px; border: 3px solid var(--line); border-radius: 24px; background: var(--paper); box-shadow: 8px 8px 0 var(--line); text-align: center; }
.icon-button { position: absolute; right: 12px; top: 8px; border: 0; background: none; font-size: 32px; cursor: pointer; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 900; color: var(--muted); }
.modal-card h2 { margin: 6px 0 16px; font-size: 28px; }
.qr-box { min-height: 220px; display: grid; place-items: center; padding: 12px; background: #fff; border: 3px solid var(--line); border-radius: 18px; }
.qr-box img, .qr-box canvas { max-width: 100%; height: auto !important; }
.modal-hint { color: var(--muted); font-size: 13px; line-height: 1.6; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 12px 18px; border: 2px solid var(--line); border-radius: 999px; background: var(--ink); color: #fff; font-weight: 800; z-index: 20; animation: toastIn .2s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } }

@media (max-width: 520px) {
  .app-shell { align-items: flex-start; padding-left: 12px; padding-right: 12px; }
  .hero-card, .scene-card, .result-card { border-radius: 24px; }
  .hero-card { padding: 25px 18px 22px; }
  .fact-row { grid-template-columns: 1fr; }
  .scene-card { padding: 20px 15px; }
  .diagnosis-grid, .result-actions { grid-template-columns: 1fr; }
  .result-actions .primary-button { grid-column: auto; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}



.work-entry-panel {
  margin-top: 16px;
  padding: 16px;
  border: 2px solid #3370ff;
  border-radius: 18px;
  background: linear-gradient(135deg, #eef4ff 0%, #ffffff 100%);

/* ===== V1.5 稳定性与动效升级 ===== */
.emoji-char, .brand-pill, .scene-pill, .answer-emoji, .answer-face, .fact, .result-title {
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", "Microsoft YaHei", sans-serif;
}
.brain {
  position: relative; width: 92px; height: 92px; margin: 20px 0 14px;
  display: grid; place-items: center; filter: none; animation: brainFloat 2.8s ease-in-out infinite;
}
.brain-core {
  width: 58px; height: 50px; border: 3px solid var(--line); border-radius: 47% 53% 45% 55%;
  background: repeating-radial-gradient(circle at 30% 30%, #ff9fc2 0 5px, #ffbad1 6px 11px);
  box-shadow: 4px 4px 0 var(--line); transform: rotate(-5deg);
}
.brain-core::before, .brain-core::after { content:""; position:absolute; background:var(--line); border-radius:999px; }
.brain-core::before { width:3px; height:34px; left:44px; top:27px; transform:rotate(8deg); }
.brain-core::after { width:18px; height:3px; left:37px; top:43px; transform:rotate(-14deg); }
.orbit { position:absolute; inset:2px; border:2px dashed rgba(25,25,25,.58); border-radius:50%; animation:orbitSpin 5s linear infinite; }
.orbit::after { content:""; position:absolute; width:10px; height:10px; border:2px solid var(--line); border-radius:50%; background:#fff; top:4px; left:13px; }
.orbit-b { inset:10px -2px; transform:rotate(62deg); animation-direction:reverse; animation-duration:3.8s; }

function supportsColorEmoji(){
  try{
    const c=document.createElement("canvas"); c.width=c.height=32;
    const x=c.getContext("2d",{willReadFrequently:true});
    x.font='24px "Segoe UI Emoji", "Apple Color Emoji", sans-serif'; x.fillText("🧠",2,25);
    const d=x.getImageData(0,0,32,32).data;
    let colorful=false;
    for(let i=0;i<d.length;i+=4){ if(d[i+3] && !(d[i]===d[i+1] && d[i+1]===d[i+2])){ colorful=true; break; } }
    return colorful;
  }catch(e){ return true; }
}
document.documentElement.classList.toggle("no-color-emoji", !supportsColorEmoji());

function animateModeTransition(callback){
  const layer=document.getElementById("modeTransition");
  if(!layer || window.matchMedia('(prefers-reduced-motion: reduce)').matches){ callback(); return; }
  layer.classList.add("active");
  window.setTimeout(()=>{ callback(); window.setTimeout(()=>layer.classList.remove("active"),150); },180);
}

function setWorkMode(on, animate=false){
  if(animate){ animateModeTransition(()=>setWorkMode(on,false)); return; }
  const next = Boolean(on);
  workMode = next;
  document.body.classList.toggle("work-mode", next);
  try { localStorage.setItem("displayMode", next ? "work" : "fun"); } catch(e) {}
  document.title = next ? "员工工作状态与协作体验调研" : "当代年轻人精神状态检测";
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = next ? "#ffffff" : "#ffdd57";
  const btn = document.getElementById("modeSwitch");
  if(btn){
    btn.textContent = next ? "返回娱乐版" : "切换办公模式";
    btn.setAttribute("aria-pressed", next ? "true" : "false");
    btn.title = next ? "切换回娱乐版（Alt+Q）" : "切换到办公模式（Alt+Q）";
  }
  const exitBtn = document.getElementById("workModeExit");
  if(exitBtn) exitBtn.hidden = !next;
  if(current===0 && answers.length===0) renderHome();
  else if(current<scenes.length) renderScene();
  else renderResult();
}

function createEmptyScores(){ return Object.fromEntries(Object.keys(TYPES).map(k => [k,0])); }
function escapeHtml(str){ return String(str).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c])); }

function faceForOption(scoreMap, index){
  const key=Object.entries(scoreMap).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const faces={
    E_PLAY:"😆", EMPATH:"🥹", SENSITIVE:"🥲", LOW_BATTERY:"😮‍💨",
    OVERTHINK:"🤯", DIRECT:"😐", PLANNER:"🤓", BALANCED:"😌"
  };
  return faces[key] || ["🙂","🙃","🫠","🤡"][index%4];
}

function memeForScene(index){
  const memes={
    1:"本人：可以。内心：已经开始写拒绝理由。",
    2:"老板七个字，你脑补七十集。",
    3:"凌晨的大脑：今日加班，现在开始。",
    4:"群聊里的沉默，也是一种团队合作。",
    8:"计划没变，情绪先开会。",
    12:"周末不是休息，是恢复出厂设置。",
    16:"恭喜，你已成功暴露。"
  };
  return memes[index+1] || "";
}

function startTest(){ current=0; answers=[]; scores=createEmptyScores(); renderScene(); }

function renderScene(){
  const s=scenes[current];
  const progress=Math.round((current/scenes.length)*100);
  const w=workQuestions[current];
  app.innerHTML = `
    <section class="screen">
      <div class="topbar"><div class="progress-wrap">

        <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
      </div></div>
      <article class="scene-card">
        <span class="scene-pill">${workMode?"单选题":"${s.icon} 第${current+1}幕"}</span>
        <h2 class="scene-title">${workMode?`${current+1}. ${w[0]}`:`《${s.title}》`}</h2>
        <div class="scene-time">${workMode?"请选择一个最符合实际情况的选项":s.time}</div>
        ${workMode?"":`<div class="chat-bubble">${escapeHtml(s.bubble)}</div><p class="scene-prompt">${s.prompt}</p>`}

          ${s.options.map((o,i)=>`<button class="answer-card" data-index="${i}"><span class="answer-emoji"><span class="emoji-char" aria-hidden="true">${o[0]}</span><span class="emoji-fallback" aria-hidden="true">选</span></span><span class="answer-copy">${escapeHtml(workMode?w[1][i]:o[1])}</span><span class="answer-face" aria-hidden="true">${faceForOption(o[2],i)}</span></button>`).join("")}
        </div>
        ${!workMode&&doctorNotes[current+1] ? `<div class="doctor-note">👨‍⚕️ ${doctorNotes[current+1].replace("陈医生：","")}</div>`:""}
        ${!workMode&&memeForScene(current) ? `<div class="meme-sticker">📌 ${memeForScene(current)}</div>` : ""}
        <div class="bottom-actions">
          ${current>0?`<button id="backBtn" class="back-link">${workMode?"← 返回上一题":"← 上一幕，我刚才嘴硬了"}</button>`:'<span></span>'}
          <span class="tiny-note">${workMode?"答案将在本地自动保存":"别选最正常的，正常人不会来测。"}</span>
        </div>
      </article>
    </section>`;
  document.querySelectorAll(".answer-card").forEach(btn=>btn.onclick=()=>choose(Number(btn.dataset.index)));
  if(current>0) document.getElementById("backBtn").onclick=goBack;
}

function apply(scoreMap, direction=1){ Object.entries(scoreMap).forEach(([k,v])=>scores[k]+=v*direction); }
function choose(optionIndex){
  const picked=scenes[current].options[optionIndex];
  answers[current]=optionIndex; apply(picked[2],1); current++;
  if(current>=scenes.length) renderLoading(); else renderScene();
}
function goBack(){
  if(current===0)return;
  current--;
  const old=answers[current];
  if(old!==undefined){ apply(scenes[current].options[old][2],-1); answers[current]=undefined; }
  renderScene();
}

function getResult(){
  const entries=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const highest=entries[0][1], lowest=entries[entries.length-1][1];
  const balancedRank=entries.findIndex(x=>x[0]==="BALANCED")+1;
  const balancedChoices=answers.reduce((n,choice,i)=>n+(scenes[i].options[choice]?.[2]?.BALANCED?1:0),0);
  const highestOther=Math.max(...Object.entries(scores).filter(([k])=>k!=="BALANCED").map(([,v])=>v));
  if(scores.BALANCED>=highestOther+2 || (highest-lowest<=5 && balancedRank<=3) || (highestOther<16 && balancedChoices>=5)) return "BALANCED";
  return entries[0][0];
}

function renderLoading(){
  app.innerHTML=`<section class="screen"><div class="loading-card"><div class="loader-face ${workMode?"":"fun-loader"}" aria-hidden="true"></div><h2 class="loading-title">${workMode?"正在提交问卷":"陈医生正在分析"}</h2><p id="loadingLine" class="loading-line">${workMode?"正在保存本次填写结果……":"正在提交你的精神状态……"}</p><div class="fake-progress"><span id="loadingBar"></span></div><p class="tiny-note">${workMode?"请勿关闭当前页面":"没有真的读取聊天记录。至少今天没有。"}</p></div></section>`;
  const lines=workMode?["正在校验填写完整性……","正在保存匿名记录……","正在生成个人反馈摘要……","正在完成数据提交……","提交成功。正在打开反馈页面……"]:["正在检查社交共享能力……","正在统计脑内小剧场……","正在测量社交电量……","正在分析计划被打乱时的反应……","系统内存差点不够用……","检测完成。你果然是——"];
  let i=0;
  const timer=setInterval(()=>{
    const line=document.getElementById("loadingLine"), bar=document.getElementById("loadingBar");
    if(!line||!bar){clearInterval(timer);return;}
    line.textContent=lines[i]; bar.style.width=`${20+(i+1)*13}%`; i++;
    if(i>=lines.length){clearInterval(timer);setTimeout(renderResult,650);}
  },650);
}

function renderResult(){
  const key=getResult(), t=TYPES[key];
  const social=Math.min(100,Math.round(scores.E_PLAY/18*100));
  const inner=Math.min(100,Math.round((scores.OVERTHINK+scores.SENSITIVE)/30*100));

  const radar=Math.min(100,Math.round((scores.EMPATH+scores.SENSITIVE)/30*100));

  <section class="screen">
    <article class="result-card">
      <span class="result-code">${workMode?"提交成功 · 记录编号 "+t.code:"检测编号 "+t.code}</span>

        <div class="diagnosis-box"><strong>社交共享</strong><span>${social}%</span></div>
        <div class="diagnosis-box"><strong>脑内小剧场</strong><span>${inner}%</span></div>
        <div class="diagnosis-box"><strong>计划依赖</strong><span>${plan}%</span></div>
        <div class="diagnosis-box"><strong>情绪雷达</strong><span>${radar}%</span></div>
      </div>
      <section class="symptoms"><h3>${workMode?"近期行为特征":"近期高发行为"}</h3><ul>${t.symptoms.map(x=>`<li>${x}</li>`).join("")}</ul></section>
      <section class="warm-note"><h3>${workMode?"个人建议":"陈医生的最后一句"}</h3>${t.advice}${workMode?"":"<br><br><strong>被说中可以笑。这样的你，也挺好的。</strong>"}</section>
      ${workMode?"":`<div class="share-text">${t.share}</div>`}
      <div class="result-actions">
        <button id="restartBtn" class="primary-button">${workMode?"重新填写":"重新检测一次"}</button>
        <button id="shareBtn" class="secondary-button">${workMode?"复制反馈摘要":"分享结果文案"}</button>
        <button id="qrBtn" class="secondary-button">${workMode?"查看问卷入口":"生成扫码入口"}</button>
      </div>
      <p class="tiny-note">${workMode?"本页面为演示性质的匿名自评工具，未连接企业后台。":"娱乐测试，不是医学诊断。V1.5 已启用表情兼容与动效优化。"}</p>
    </article>
  </section>`;
  document.getElementById("restartBtn").onclick=startTest;
  document.getElementById("shareBtn").onclick=()=>shareResult(t);
  document.getElementById("qrBtn").onclick=openQr;
}

async function shareResult(t){
  const text=`${t.share}\n\n来测测你的精神状态：${location.href}`;
  try{
    if(navigator.share){ await navigator.share({title:"当代年轻人精神状态检测",text,url:location.href}); }
    else { await navigator.clipboard.writeText(text); showToast("结果文案已复制"); }
  }catch(e){ if(e.name!=="AbortError") fallbackCopy(text); }
}
function fallbackCopy(text){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); showToast("结果文案已复制"); }
function showToast(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),1800); }

const modal=document.getElementById("qrModal");
function openQr(){
  modal.classList.remove("hidden");
  const box=document.getElementById("qrcode"); box.innerHTML="";
  if(window.QRCode){ new QRCode(box,{text:location.href,width:210,height:210,colorDark:"#191919",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H}); }
  else { const img=document.createElement("img"); img.alt="测试入口二维码"; img.width=210; img.height=210; img.src="https://api.qrserver.com/v1/create-qr-code/?size=210x210&data="+encodeURIComponent(location.href); box.appendChild(img); }
}
document.getElementById("closeQr").onclick=()=>modal.classList.add("hidden");
modal.onclick=e=>{if(e.target===modal)modal.classList.add("hidden")};
document.getElementById("copyLink").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);showToast("测试链接已复制")}catch{fallbackCopy(location.href)}};

const modeSwitchBtn = document.getElementById("modeSwitch");
const workModeExitBtn = document.getElementById("workModeExit");
modeSwitchBtn.addEventListener("click", (e)=>{
  e.preventDefault();
  e.stopPropagation();
  setWorkMode(!document.body.classList.contains("work-mode"), true);
});
workModeExitBtn.addEventListener("click", (e)=>{
  e.preventDefault();
  e.stopPropagation();
  setWorkMode(false, true);
});
document.addEventListener("keydown", e=>{
  if(e.altKey && e.key.toLowerCase()==="q"){
    e.preventDefault();
    setWorkMode(!document.body.classList.contains("work-mode"), true);
  } else if(e.key==="Escape"){
    setWorkMode(true, true);
  }
});
setWorkMode(workMode);

</script>
